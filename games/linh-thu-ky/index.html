  /* nền */

async function useMove(s,mv){

    const atk=as.atk*mult(B.stg[s].atk),def=ds.def*mult(B.stg[other(s)].def);
    const dmg=Math.max(1,Math.floor((((2*a.lvl/5+2)*mv.pow*atk/def)/50+2)*eff*stab*(crit?1.5:1)*rnd(.86,1)));

async function battle(foes,tr){

  B={foes,fi:0,foe:foes[0],mine:alive()[0],tr:tr||null,o:{mine:newO(),foe:newO()},stg:{mine:{atk:0,def:0},foe:{atk:0,def:0}},dhp:{mine:0,foe:0},fx:[],proj:null,ball:null,shake:0,bg:'bg_'+(tr&&tr.bg?tr.bg:ZONES[zoneAt()].bg),trk:0,hk:1};

    else if(act.k==='switch'){await bmsg('Về đi, '+SP[B.mine.sp].n+'!',.3);await tween(200,k=>{B.o.mine.k=1-k});await sendOut('mine',S.party[act.i]);await bmsg('Tiến lên, '+SP[B.mine.sp].n+'!',.4)}

function blocked(x,y,r){for(const[ox,oy]of[[-r,-r*.5],[r,-r*.5],[-r,r*.5],[r,r*.5]])if(solid(Math.floor((x+ox)/T),Math.floor((y+oy)/T)))return true;return false}
function update(dt){
  time+=dt;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.d);tw.fn(k);if(k>=1){tweens.splice(i,1);tw.res()}}

  if(B)B.shake=Math.max(0,B.shake-dt*40);
  if(state!=='world'||busy||box||menu){P.moving=false;return}
  S.t+=dt;
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy){ix=joy.x;iy=joy.y}
  let il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;il=1}
  P.moving=il>.15;if(P.moving){P.fx=ix/il;P.fy=iy/il;P.walk+=dt;const dx=ix*170*dt,dy=iy*170*dt;if(!blocked(S.x+dx,S.y,P.r))S.x+=dx;if(!blocked(S.x,S.y+dy,P.r))S.y+=dy}
  if(press.KeyE||press.Space||press.Enter){const n=nearest();if(n){run(()=>talkNpc(n));return}}
  if(press.KeyQ||press.KeyP){run(openParty);return}
  for(const n of M.npcs)if(n.tr&&!S.beat[n.id]&&alive().length&&Math.hypot(n.x-S.x,n.y-S.y)<68){run(()=>fightTrainer(n));return}
  const tx=Math.floor(S.x/T),ty=Math.floor(S.y/T);
  if(tx!==P.ltx||ty!==P.lty){P.ltx=tx;P.lty=ty;if(M.u[ty][tx]==='g'&&alive().length&&Math.random()<.12){run(async()=>{sfx(300,.12,'square',.05);sfx(450,.12,'square',.05);await battle([wildMon(zoneAt())],null)})}}
}

function drawTitle(g,t){g.fillStyle='rgba(4,6,16,.5)';g.fillRect(0,0,W,H);g.textAlign='center';g.textBaseline='middle';const s=clamp(Math.min(W/700,H/600),.5,1.25);
