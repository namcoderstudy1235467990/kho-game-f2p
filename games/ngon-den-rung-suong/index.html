let AC=null,mute=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function sfx(f,d=.1,type='sine',v=.07,slide=0){if(!AC||mute)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}

/* ============ bản đồ ============ */
const SOLID='#RPbXL';
function mk(id,name,w,h,pal){return{id,name,w,h,pal,u:Array.from({length:h},()=>Array(w).fill('.')),g:Array.from({length:h},()=>Array(w).fill('.')),res:new Set(),npcs:[],spawn:[],exits:[],torches:[],chests:[],houses:[],props:[],lights:[],objs:[]}}
function st(m,x,y,c){if(x<0||y<0||x>=m.w||y>=m.h)return;if('.,~'.includes(c))m.u[y][x]=c;m.g[y][x]=c}
function rsv(m,x,y,r=1){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)m.res.add((x+i)+','+(y+j))}
function rect(m,x0,y0,x1,y1,c,keep){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){st(m,x,y,c);if(keep)rsv(m,x,y,0)}}
function path(m,pts,c=','){for(let i=0;i<pts.length-1;i++){let[x,y]=pts[i];const[bx,by]=pts[i+1];for(;;){st(m,x,y,c);rsv(m,x,y);if(x===bx&&y===by)break;if(x!==bx)x+=Math.sign(bx-x);else y+=Math.sign(by-y)}}}
function border(m,c,n){for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)if(x<n||y<n||x>=m.w-n||y>=m.h-n)m.g[y][x]=c}
function scat(m,c,n,R,free){for(let i=0,k=0;k<n&&i<n*40;i++){const x=R()*m.w|0,y=R()*m.h|0;if(m.g[y][x]==='.'&&m.u[y][x]==='.'&&(free||!m.res.has(x+','+y))){m.g[y][x]=c;k++}}}
const MAPS={};
function build(){
  let m,R;
  /* --- Làng --- */

  border(m,'#',1);
  rect(m,13,9,17,13,',');for(let y=8;y<=14;y++)for(let x=12;x<=18;x++)rsv(m,x,y,0);
  path(m,[[4,11],[29,11]]);path(m,[[15,9],[15,5]]);path(m,[[15,13],[15,18]]);path(m,[[8,11],[8,7]]);path(m,[[22,11],[22,7]]);
  rect(m,28,10,29,12,',',true);
  m.houses=[{x:7,y:4,w:4,h:3,s:[0,0,4,3]},{x:21,y:4,w:4,h:3,s:[8,0,4,3]},{x:14,y:2,w:4,h:3,s:[12,0,4,3]}];
  for(const h of m.houses){rect(m,h.x,h.y,h.x+h.w-1,h.y+h.h-1,'X');for(let y=h.y-1;y<=h.y+h.h;y++)for(let x=h.x-1;x<=h.x+h.w;x++)rsv(m,x,y,0)}
  rect(m,5,15,9,17,'~');for(let y=14;y<=18;y++)for(let x=4;x<=10;x++)rsv(m,x,y,0);
  st(m,15,11,'L');m.props.push({k:'lantern',x:15.5*T,y:12*T-6});
  m.torches=[[13.5,9.8],[17.5,9.8],[13.5,13.8],[17.5,13.8]];
  rsv(m,9,9,1);rsv(m,21,8,1);
  scat(m,'#',26,R);scat(m,'b',12,R);scat(m,'f',60,R,true);
  m.npcs=[{id:'elder',x:17.2*T,y:11.7*T,fx:-1,fy:0},{id:'smith',x:20.5*T,y:8.2*T,fx:0,fy:1},{id:'kid',x:9.6*T,y:9.5*T,hx:9.6*T,fx:0,fy:1}];
  m.exits=[{x0:29,y0:10,x1:29,y1:12,to:'forest',tx:2.5,ty:14.5,need:'elder'}];
  MAPS.village=m;
  /* --- Rừng --- */
  m=mk('forest','Rừng Thì Thầm',40,28,{amb:'rgba(6,14,40,.52)',fog:.45,base:[11,12],det:[[12,12],[13,12],[14,12],[15,12]],path:[11,7],trees:[[0,0,2,2],[2,0,2,2],[2,0,2,2],[6,0,2,2],[3,18,3,3]],bush:[[0,10],[1,10],[2,10]],cry:[1,14],cryCol:'90,200,255',amb2:'leaf'});R=mulberry(23);
  border(m,'#',2);
  path(m,[[0,14],[8,14],[8,8],[18,8],[18,18],[28,18],[28,12],[39,12]]);
  path(m,[[18,8],[18,4],[29,4]]);rect(m,29,3,34,7,',',true);for(let y=2;y<=8;y++)for(let x=28;x<=35;x++)rsv(m,x,y,0);
  path(m,[[8,14],[8,22],[13,22]]);rect(m,0,13,1,15,',',true);rect(m,38,11,39,13,',',true);
  st(m,14,22,'X');rsv(m,14,22);m.chests.push({id:'f1',x:14.5*T,y:23*T-4});
  scat(m,'#',300,R);scat(m,'b',30,R);scat(m,'m',34,R,true);scat(m,'f',40,R,true);
  m.spawn=[['slime',12.5,8.5],['slime',16.5,9.6],['mush',18.5,14.5],['slime',22.5,18.5],['mush',27.5,16.5],['slime',8.5,19.5],['mush',24.5,4.5],['slime',33.5,12.5],['slime',28.5,13.5],['king',32,5.5]];
  m.exits=[{x0:0,y0:13,x1:0,y1:15,to:'village',tx:27.5,ty:11.5},{x0:39,y0:11,x1:39,y1:13,to:'ruins',tx:2.5,ty:13.5}];
  MAPS.forest=m;
  /* --- Phế tích --- */
  m=mk('ruins','Phế Tích Nguyệt Thạch',36,26,{amb:'rgba(22,10,44,.48)',fog:.5,base:[11,19],det:[[12,19],[13,19],[14,19],[15,19]],path:[11,14],trees:[[4,0,2,2],[4,0,2,2],[9,18,3,3],[13,8,2,2]],bush:[[15,9]],cry:[2,14],cryCol:'200,120,255',amb2:'leaf'});R=mulberry(37);
  border(m,'#',2);
  rect(m,8,5,28,21,',');
  for(let x=8;x<=28;x++){st(m,x,5,'R');st(m,x,21,'R')}for(let y=5;y<=21;y++){st(m,8,y,'R');st(m,28,y,'R')}
  rect(m,8,12,8,14,',');rect(m,17,5,19,5,',');
  rect(m,12,10,16,10,'R');rect(m,20,10,24,10,'R');rect(m,12,16,16,16,'R');rect(m,20,16,24,16,'R');
  for(const[x,y]of[[11,8],[25,8],[11,18],[25,18],[15,13]])st(m,x,y,'P');
  path(m,[[0,13],[7,13]]);rect(m,0,12,1,14,',',true);
  rect(m,17,0,19,4,',',true);for(let y=0;y<=4;y++)for(let x=16;x<=20;x++)rsv(m,x,y,0);
  m.barrier={x0:17,x1:19,y:3};
  st(m,26,13,'X');m.props.push({k:'altar',x:26.5*T,y:14*T-4});
  st(m,10,19,'X');m.chests.push({id:'r1',x:10.5*T,y:20*T-4});
  m.torches=[[16.5,6.8],[20.5,6.8],[9.6,11.6],[9.6,15.8]];
  scat(m,'#',95,R);scat(m,'b',14,R);scat(m,'m',16,R,true);
  m.spawn=[['flam',12.5,7.5],['flam',24.5,7.5],['flam',12.5,18.8],['flam',24.5,18.8],['flam',18.5,9],['flam',18.5,18],['slime',4.5,10.5],['mush',5.5,16.5],['beast',23.5,13.5]];
  m.exits=[{x0:0,y0:12,x1:0,y1:14,to:'forest',tx:37.5,ty:12.5},{x0:17,y0:0,x1:19,y1:0,to:'shrine',tx:12.5,ty:17.3}];
  MAPS.ruins=m;
  /* --- Đền Sương --- */
  m=mk('shrine','Đền Sương',24,20,{amb:'rgba(20,26,70,.38)',fog:1,base:[0,25],det:[],path:[0,21],trees:[[8,0,2,2],[10,0,2,2],[12,0,2,2],[6,18,3,3]],bush:[[5,12]],amb2:'snow',blue:true});R=mulberry(51);
  border(m,'#',2);rect(m,4,3,19,16,',');rect(m,11,17,13,19,',');
  for(let y=2;y<=19;y++)for(let x=3;x<=20;x++)rsv(m,x,y,0);
  for(const[x,y]of[[6,5],[17,5],[6,14],[17,14]])st(m,x,y,'P');
  m.torches=[[8.5,4],[15.5,4],[8.5,15.6],[15.5,15.6]];
  m.spawn=[['boss',12,7.5]];
  m.exits=[{x0:11,y0:19,x1:13,y1:19,to:'ruins',tx:18.5,ty:2.5}];

}
function prep(m){
  const R=mulberry(m.w*31+m.h),p=m.pal;
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){const c=m.g[y][x];
    if(c==='#'){const s=p.trees[R()*p.trees.length|0];m.objs.push({k:'spr',img:'nature',s,x:(x+.5)*T+((R()*5|0)-2)*SC,y:(y+1)*T-SC*(R()*4|0)})}
    else if(c==='P')m.objs.push(m.id==='shrine'?{k:'spr',img:'nature',s:[2,12,2,2],x:(x+.5)*T,y:(y+1)*T+6}:{k:'spr',img:'house',s:[0,19,1,3],x:(x+.5)*T,y:(y+1)*T-3});
    else if(c==='m')m.lights.push({x:(x+.5)*T,y:(y+.5)*T,r:62,a:.8,col:p.cryCol,ga:.22,gr:34});
  }
  for(const h of m.houses){m.objs.push({k:'spr',img:'house',s:h.s,x:(h.x+h.w/2)*T,y:(h.y+h.h)*T});m.lights.push({x:(h.x+1.5)*T,y:(h.y+h.h)*T-20,r:120,a:.85,col:'255,200,110',ga:.2,gr:60})}
  for(const[x,y]of m.torches){m.objs.push({k:'torch',x:x*T,y:y*T});m.lights.push({x:x*T,y:y*T-30,r:170,a:1,col:p.blue?'150,190,255':'255,160,70',ga:.26,gr:84,fl:1})}
  for(const o of m.props)m.objs.push(o);
  for(const c of m.chests)m.objs.push({k:'chest',c,x:c.x,y:c.y});
  bake(m);
}
function amask(m,x,y,ch){const f=(i,j)=>{const X=x+i,Y=y+j;return X<0||Y<0||X>=m.w||Y>=m.h||m.u[Y][X]===ch};const N=f(0,-1),E=f(1,0),S=f(0,1),Wt=f(-1,0);let k=(N?1:0)|(E?2:0)|(S?4:0)|(Wt?8:0);if(N&&E&&f(1,-1))k|=16;if(S&&E&&f(1,1))k|=32;if(S&&Wt&&f(-1,1))k|=64;if(N&&Wt&&f(-1,-1))k|=128;return AUTO[k]||AUTO[255]}
function bake(m){
  const c=document.createElement('canvas');c.width=m.w*16;c.height=m.h*16;const g=c.getContext('2d'),R=mulberry(m.w*7+m.h*13),p=m.pal;g.imageSmoothingEnabled=false;
  const tl=(img,cx,cy,x,y)=>g.drawImage(A[img],cx*16,cy*16,16,16,x*16,y*16,16,16);
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){const u=m.u[y][x],ch=m.g[y][x];
    if(u===','){const a=amask(m,x,y,',');tl('floor',p.path[0]+a[0],p.path[1]+a[1],x,y)}
    else if(u==='~'&&p.water){const a=amask(m,x,y,'~');tl('water',p.water[0]+a[0],p.water[1]+a[1],x,y)}
    else{const d=p.det.length&&R()<.3?p.det[R()*p.det.length|0]:p.base;tl('floor',d[0],d[1],x,y)}
    if(ch==='f'){const f=[[0,11],[1,11],[3,11],[6,11],[3,10],[5,10],[8,10]][R()*7|0];tl('nature',f[0],f[1],x,y)}
    else if(ch==='b'){const b=p.bush[R()*p.bush.length|0];tl('nature',b[0],b[1],x,y)}
    else if(ch==='m')tl('nature',p.cry[0],p.cry[1],x,y);
    else if(ch==='R'){const r=[[17,17],[18,17],[19,17],[18,9]][R()*4|0];tl('nature',r[0],r[1],x,y)}
  }
  m.cv=c;
}
function solid(m,tx,ty){if(tx<0||ty<0||tx>=m.w||ty>=m.h)return true;if(m.u[ty][tx]==='~'||SOLID.includes(m.g[ty][tx]))return true;const b=m.barrier;if(b&&!(F.s1&&F.s2)&&ty===b.y&&tx>=b.x0&&tx<=b.x1)return true;return false}

/* ============ trạng thái ============ */
const F={elder:0,s1:0,s2:0,s3:0,smith:0,kid:0,bossIntro:0,ended:0,chest:{}};
const P={x:0,y:0,r:12,hp:60,mhp:60,lvl:1,xp:0,atk:5,pot:1,fx:0,fy:1,walk:0,moving:false,atkT:0,atkCd:0,atkA:0,dashT:0,dashCd:0,ddx:0,ddy:0,inv:0,kx:0,ky:0};
let state='load',cur=null,ents=[],shots=[],parts=[],texts=[],items=[],timers=[],amb=[];
let time=0,playT=0,shake=0,banner=0,msgCd=0,hintT=18,dlg=null,camX=0,camY=0,kills=0;
const fade={a:0,dir:0,cb:null,col:'#05070c'};
function startFade(cb,col){fade.dir=1;fade.cb=cb;fade.col=col||'#05070c'}
function after(s,fn){timers.push({s,fn})}
const ET={slime:{hp:14,r:13,dmg:6,xp:6,img:'slime',sc:3,h:20},mush:{hp:22,r:13,dmg:7,xp:9,img:'mush',sc:3,h:22},king:{hp:95,r:30,dmg:12,xp:45,img:'king',sc:6,h:44},flam:{hp:22,r:14,dmg:9,xp:12,img:'flam',sc:3,h:24},ghost:{hp:8,r:10,dmg:8,xp:3,img:'ghost',sc:2,h:16},beast:{hp:150,r:28,dmg:18,xp:70,img:'beast',sc:6,h:46},boss:{hp:340,r:40,dmg:14,xp:0,sc:4,h:60}};
function spawnE(t,x,y){const d=ET[t],e={t,d,x,y,hp:d.hp,mhp:d.hp,r:d.r,dmg:d.dmg,xp:d.xp,vx:0,vy:0,kx:0,ky:0,tm:rnd(.4,1.4),t2:2,flash:0,ph:rnd(6),st:0,hopT:0,n:0,pat:0,burst:0,bt:0,spiral:0,sa:0,da:0,fx:0,fy:1,atkA:0};ents.push(e);return e}
function enterMap(id,tx,ty){cur=MAPS[id];P.x=tx*T;P.y=ty*T;P.kx=P.ky=0;P.dashT=0;ents=[];shots=[];items=[];parts=[];texts=[];
  for(const[t,x,y]of cur.spawn){if(t==='king'&&F.s1)continue;if(t==='beast'&&F.s2)continue;if(t==='boss'&&F.s3)continue;spawnE(t,x*T,y*T)}
  amb=[];for(let i=0;i<(id==='shrine'?60:26);i++)amb.push({x:rnd(1),y:rnd(1),sp:rnd(.5,1.2),ph:rnd(6)});
  banner=3;
  if(id==='shrine'&&!F.bossIntro){F.bossIntro=1;after(.5,()=>say([['boss','Ộp... Lại một đốm sáng nhỏ lạc vào sương. Ta đã nuốt mảnh lửa cuối cùng, và ta sẽ nuốt luôn cả ngươi!'],['lam','Thầy Vân đâu? Ngươi đã làm gì thầy ta?!'],['boss','Lão già giữ đèn ư? Lão vẫn ở đây, trong băng, canh ta suốt ba năm. Phiền phức! Ộp!'],['lam','Thầy vẫn còn sống... Vậy thì ta chỉ cần đánh bại ngươi thôi!']]))}
}

addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;initAudio();keys[e.code]=1;press[e.code]=1;

function nearest(){let b=null,bd=66;for(const n of cur.npcs){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<bd){bd=d;b={k:'npc',o:n}}}for(const c of cur.chests){if(F.chest[c.id])continue;const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;b={k:'chest',o:c}}}return b}

function update(dt){
  time+=dt;
  if(fade.dir){fade.a+=fade.dir*dt*2.2;if(fade.a>=1&&fade.dir===1){fade.a=1;fade.dir=-1;const c=fade.cb;fade.cb=null;if(c)c()}else if(fade.a<=0&&fade.dir===-1){fade.a=0;fade.dir=0}}
  shake=Math.max(0,shake-dt*30);banner-=dt;msgCd-=dt;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94}
  for(let i=texts.length-1;i>=0;i--){const p=texts[i];p.life-=dt;p.y-=34*dt;if(p.life<=0)texts.splice(i,1)}
  if(state==='dialog'&&dlg){dlg.c+=dt*48;return}
  if(state!=='play'||fade.dir===1)return;
  playT+=dt;hintT-=dt;
  for(let i=timers.length-1;i>=0;i--){const tm=timers[i];tm.s-=dt;if(tm.s<=0){timers.splice(i,1);tm.fn();if(state!=='play')return}}
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy){ix=joy.x;iy=joy.y}
  let il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;il=1}
  P.moving=il>.15;if(P.moving){P.fx=ix/il;P.fy=iy/il;P.walk+=dt}
  P.atkCd-=dt;P.atkT-=dt;P.dashCd-=dt;P.inv-=dt;
  if((press.KeyK||press.ShiftLeft||press.ShiftRight)&&P.dashCd<=0){P.dashT=.16;P.dashCd=.75;P.ddx=P.fx;P.ddy=P.fy;P.inv=Math.max(P.inv,.22);sfx(420,.14,'sine',.05,500)}
  if((press.KeyJ||press.Space||press.Mouse)&&P.atkCd<=0){
    let a=Math.atan2(P.fy,P.fx);
    if(press.Mouse&&mouse.on){a=Math.atan2(mouse.y/Z+camY-(P.y-20),mouse.x/Z+camX-P.x)}
    else{let bd=120,be=null;for(const e of ents){const d=Math.hypot(e.x-P.x,e.y-P.y)-e.r;if(d<bd){bd=d;be=e}}if(be)a=Math.atan2(be.y-be.d.h-(P.y-20),be.x-P.x)}
    P.atkA=a;P.atkT=.2;P.atkCd=.3;P.fx=Math.cos(a);P.fy=Math.sin(a);sfx(700,.09,'sawtooth',.035,-450);
    for(const e of ents.slice()){const dx=e.x-P.x,dy=(e.y-e.d.h)-(P.y-20),d=Math.hypot(dx,dy);if(d>64+e.r)continue;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<1.25||d<e.r+10){const crit=Math.random()<.12;damage(e,Math.round((P.atk+rnd(-1,2))*(crit?2:1)),Math.atan2(dy,dx),crit)}}
    for(let i=shots.length-1;i>=0;i--){const s=shots[i],dx=s.x-P.x,dy=s.y-(P.y-20),d=Math.hypot(dx,dy);if(d<68){let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<1.3){fxAt(s.x,s.y,'star',.2,2);shots.splice(i,1)}}}
  }
  if(press.KeyQ&&P.pot>0&&P.hp<P.mhp){P.pot--;P.hp=Math.min(P.mhp,P.hp+40);ftext(P.x,P.y-52,'+40','#7dffb0');burst(P.x,P.y-20,10,'spark',90,.7);sfx(600,.25,'sine',.06,300)}
  if(press.KeyE){const n=nearest();if(n){if(n.k==='npc'){n.o.fx=P.x-n.o.x;n.o.fy=P.y-n.o.y;talk(n.o.id);return}else{F.chest[n.o.id]=1;P.pot+=2;ftext(n.o.x,n.o.y-44,'+2 Thuốc','#7dffb0',true);burst(n.o.x,n.o.y-20,14,'spark',140,.8);sfx(660,.12,'triangle',.07);after(.12,()=>sfx(990,.25,'triangle',.07))}}}
  let vx=ix*178,vy=iy*178;
  if(P.dashT>0){P.dashT-=dt;vx=P.ddx*640;vy=P.ddy*640;if(Math.random()<.6)fxAt(P.x+rnd(-6,6),P.y-18+rnd(-6,6),'spark',.3,3)}
  mv(P,(vx+P.kx)*dt,(vy+P.ky)*dt);P.kx*=Math.pow(.002,dt);P.ky*=Math.pow(.002,dt);
  const ptx=Math.floor(P.x/T),pty=Math.floor(P.y/T),b=cur.barrier;
  if(b&&!(F.s1&&F.s2)&&pty===b.y+1&&ptx>=b.x0&&ptx<=b.x1&&iy<-.3&&msgCd<=0){msgCd=4;return say([['sys','Một kết giới sương chắn lối. Cần hai Tàn Lửa để mở.']])}
  for(const ex of cur.exits)if(ptx>=ex.x0&&ptx<=ex.x1&&pty>=ex.y0&&pty<=ex.y1){
    if(ex.need&&!F[ex.need]){P.x-=40;return say([['lam','Mình nên nói chuyện với Ông Mộc trước khi rời làng.']])}

  for(const n of cur.npcs)if(n.id==='kid'){const ox=n.x;n.x=n.hx+Math.sin(time*.6)*30;n.moving=Math.abs(Math.cos(time*.6))>.25;if(n.moving){n.fx=Math.sign(n.x-ox)||n.fx;n.fy=0;n.walk=(n.walk||0)+dt}}

      else if(e.tm<=0&&d<(K?460:300)){const s=K?200:150,aa=a+rnd(-.25,.25);e.vx=Math.cos(aa)*s;e.vy=Math.sin(aa)*s;e.hopT=.38;e.tm=K?(e.hp<e.mhp/2?.55:.8):rnd(.8,1.25);

  const air=e.hopT>0?Math.sin((1-e.hopT/.38)*Math.PI)*d.sc*4:0,bob=e.t==='flam'||e.t==='ghost'?Math.sin(t*4+e.ph)*3+4:0;

  g.font='600 12.5px '+UI;const qw=Math.min(sm?W-24:300,W-24),ql=wrap(g,quest(),qw-28),qh=30+ql.length*17,qx=sm?12:W-qw-12,qy=sm?88:12;panel(g,qx,qy,qw,qh);g.fillStyle='#ffe08a';g.font='700 10px '+UI;g.fillText('NHIỆM VỤ',qx+14,qy+15);g.font='600 12.5px '+UI;g.fillStyle='#e8ecf8';ql.forEach((l,i)=>g.fillText(l,qx+14,qy+33+i*17));

    if(joy){g.fillStyle='rgba(20,24,44,.4)';circ(g,joy.ox,joy.oy,54);g.fillStyle='rgba(255,224,138,.55)';circ(g,joy.ox+joy.x*50,joy.oy+joy.y*50,22)}}
}

  const ls=wrap(g,text,tw);let ty=y+h/2-(ls.length*lh)/2+fsz*.95,left=Math.floor(dlg.c);for(const l of ls){if(left<=0)break;g.fillText(l.slice(0,left),tx,ty);left-=l.length+1;ty+=lh}

}

function drawEnd(g,t){g.fillStyle='rgba(4,6,16,.55)';g.fillRect(0,0,W,H);const w=Math.min(W-24,480),h=270,x=(W-w)/2,y=(H-h)/2;panel(g,x,y,w,h,16);g.textAlign='center';g.textBaseline='middle';
